<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <button class="nav-btn" onclick="go('home.html')">
    <i class="fa-solid fa-house"></i>
    Home
  </button>

  <button class="nav-btn active-nav" onclick="go('index.html')">
    <i class="fa-solid fa-chart-line"></i>
    Dashboard
  </button>

  <button class="nav-btn" onclick="go('notes.html')">
    <i class="fa-solid fa-note-sticky"></i>
    Notes
  </button>

</div>

<!-- MAIN -->
<div class="main">

  <h1 class="page-title">
    📚 DevOps Roadmap
  </h1>

  <div
    id="subjectsContainer"
    class="subjects-grid">

    <p>Loading roadmap...</p>

  </div>

</div>

<script>

/* =========================================
   NAVIGATION
========================================= */

function go(page){

  window.location.href = page
}

/* =========================================
   GET USER
========================================= */

async function getUser(){

  const { data } =
    await supabaseClient.auth.getUser()

  return data?.user
}

/* =========================================
   TOGGLE WEEK
========================================= */

function toggleWeek(id){

  const element =
    document.getElementById(id)

  element.classList.toggle("show-week")
}

/* =========================================
   TOGGLE TOPIC
========================================= */

function toggleTopic(id){

  const element =
    document.getElementById(id)

  element.classList.toggle("show-topic")
}

/* =========================================
   TOGGLE SUBTOPIC (FINAL FIXED)
========================================= */

    async function toggleSubtopic(event, subtopicId, checked){

  try {

    /* STOP ANY DEFAULT BEHAVIOR */
    if(event){
      event.preventDefault()
      event.stopPropagation()
    }

    const user = await getUser()

    if(!user){

      console.error("No user found")
      return
    }

    console.log("USER ID:", user.id)

    /* CHECK EXISTING ENTRY */

    const { data: existing, error: fetchError } =
      await supabaseClient
        .from("subtopic_progress")
        .select("*")
        .eq("user_id", user.id)
        .eq("subtopic_id", subtopicId)
        .maybeSingle()

    if(fetchError){
      console.error("FETCH ERROR:", fetchError)
    }

    /* DELETE OR INSERT */

    if(existing){

      const { error: deleteError } =
        await supabaseClient
          .from("subtopic_progress")
          .delete()
          .eq("id", existing.id)

      if(deleteError){
        console.error("DELETE ERROR:", deleteError)
      }

    } else {

      const { error: insertError } =
        await supabaseClient
          .from("subtopic_progress")
          .insert([{

            user_id: user.id,
            subtopic_id: subtopicId,
            completed: true

          }])

      if(insertError){
        console.error("INSERT ERROR:", insertError)
      }
    }

    /* DO NOT FULL RELOAD */

    console.log("Toggle complete")
    await loadSubjects()

  } catch(err){

    console.error("TOGGLE ERROR:", err)
  }
}

/* =========================================
   LOAD SUBJECTS - OPTIMIZED
========================================= */

async function loadSubjects(){

  const user = await getUser()

  const container =
    document.getElementById("subjectsContainer")

  container.innerHTML = `
    <p>Loading roadmap...</p>
  `

  try {

    /* FETCH EVERYTHING IN PARALLEL */

    const [

      subjectsRes,
      weeksRes,
      topicsRes,
      subtopicsRes,
      progressRes

    ] = await Promise.all([

      supabaseClient
        .from("subjects")
        .select("*")
        .order("created_at", {
          ascending:true
        }),

      supabaseClient
        .from("weeks")
        .select("*")
        .order("week_number", {
          ascending:true
        }),

      supabaseClient
        .from("topics")
        .select("*"),

      supabaseClient
        .from("subtopics")
        .select("*"),

      supabaseClient
        .from("subtopic_progress")
        .select("*")
        .eq("user_id", user.id)

    ])

    const subjects =
      subjectsRes.data || []

    const weeks =
      weeksRes.data || []

    const topics =
      topicsRes.data || []

    const subtopics =
      subtopicsRes.data || []

    const progress =
      progressRes.data || []

    /* USER COMPLETED IDS */

    const completedIds =
      progress.map(
        p => p.subtopic_id
      )

    let html = ""

    /* SUBJECT LOOP */

    for(const subject of subjects){

      const subjectWeeks =
        weeks.filter(
          w => w.subject_id === subject.id
        )

      const weekIds =
        subjectWeeks.map(
          w => w.id
        )

      const subjectTopics =
        topics.filter(
          t => weekIds.includes(t.week_id)
        )

      const topicIds =
        subjectTopics.map(
          t => t.id
        )

      const subjectSubtopics =
        subtopics.filter(
          s => topicIds.includes(s.topic_id)
        )

      /* SUBJECT PROGRESS */

      const totalSubtopics =
        subjectSubtopics.length

      const completedSubtopics =
        subjectSubtopics.filter(
          s => completedIds.includes(s.id)
        ).length

      const percent =
        totalSubtopics > 0
        ? Math.round(
            (completedSubtopics / totalSubtopics) * 100
          )
        : 0

      html += `

        <div class="card subject-card">

          <div class="subject-top">

            <h2>
              📘 ${subject.name}
            </h2>

            <span class="subject-progress">
              ${percent}%
            </span>

          </div>

      `

      /* WEEK LOOP */

      for(const week of subjectWeeks){

        const weekTopics =
          subjectTopics.filter(
            t => t.week_id === week.id
          )

        html += `

          <div class="week-card">

            <div
              class="week-header"
              onclick="toggleWeek('week-${week.id}')">

              <span>
                ▶ Week ${week.week_number}
              </span>

              <span>
                ${week.title}
              </span>

            </div>

            <div
              id="week-${week.id}"
              class="week-content">

        `

        /* TOPIC LOOP */

        for(const topic of weekTopics){

          const topicSubtopics =
            subjectSubtopics.filter(
              s => s.topic_id === topic.id
            )

          const topicCompleted =
            topicSubtopics.filter(
              s => completedIds.includes(s.id)
            ).length

          const topicPercent =
            topicSubtopics.length > 0
            ? Math.round(
                (topicCompleted / topicSubtopics.length) * 100
              )
            : 0

          html += `

            <div class="topic-card">

              <div
                class="topic-header"
                onclick="toggleTopic('topic-${topic.id}')">

                <div class="topic-title">

                  <span>
                    ▶ ${topic.title}
                  </span>

                  <span class="topic-progress">
                    ${topicPercent}%
                  </span>

                </div>

              </div>

              <div
                id="topic-${topic.id}"
                class="topic-content">

          `

          /* SUBTOPICS LOOP */

          for(const sub of topicSubtopics){

            const checked =
              completedIds.includes(sub.id)

            html += `

              <div class="subtopic-item">

                <label class="checkbox-label">

<input
  type="checkbox"

  onchange="
    toggleSubtopic(
      event,
      '${sub.id}',
      this.checked
    )
  "
>

                  <span>
                    ${sub.title}
                  </span>

                </label>

              </div>
            `
          }

          html += `
              </div>
            </div>
          `
        }

        html += `
            </div>
          </div>
        `
      }

      html += `
        </div>
      `
    }

    container.innerHTML = html

  } catch(err){

    console.error(err)

    container.innerHTML = `
      <p>Error loading roadmap</p>
    `
  }
}

/* =========================================
   INITIAL LOAD
========================================= */

loadSubjects()

</script>

</body>
</html>
