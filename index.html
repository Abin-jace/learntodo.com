<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<div class="sidebar">

  <button class="nav-btn" onclick="go('home.html')">
    <i class="fa-solid fa-house"></i> Home
  </button>

  <button class="nav-btn" onclick="go('index.html')">
    <i class="fa-solid fa-chart-line"></i> Dashboard
  </button>

  <button class="nav-btn" onclick="go('notes.html')">
    <i class="fa-solid fa-note-sticky"></i> Notes
  </button>

</div>

<div class="main">

  <h2>Team Progress</h2>

  <div id="content">Loading...</div>

</div>

<script>

function go(p){ window.location.href = p }

async function load(){

  const { data: users } = await supabaseClient.from("profiles").select("*")
  const { data: progress } = await supabaseClient.from("progress").select("*")

  let html = ""

  users?.forEach(u => {

    const p = progress?.find(x => x.user_id === u.id)

    html += `
      <div class="card">
        <h3>${u.name}</h3>

        <p>Linux</p>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${p?.linux || 0}%"></div>
        </div>

        <p>Docker</p>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${p?.docker || 0}%"></div>
        </div>

        <p>Kubernetes</p>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${p?.kubernetes || 0}%"></div>
        </div>

      </div>
    `
  })

  document.getElementById("content").innerHTML = html
}

load()

</script>

</body>
</html>
