<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>Home</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

</head>

<body class="home-page">

<!-- SIDEBAR -->
<div class="sidebar">

  <button class="nav-btn" onclick="go('home.html')">
    <i class="fa-solid fa-house"></i>
    Home
  </button>

  <button class="nav-btn" onclick="go('index.html')">
    <i class="fa-solid fa-chart-line"></i>
    Dashboard
  </button>

  <button class="nav-btn" onclick="go('notes.html')">
    <i class="fa-solid fa-note-sticky"></i>
    Notes
  </button>

</div>

<!-- MAIN -->
<div class="main home-main">

  <!-- TOP BAR -->
  <div class="top-bar">

    <!-- NOTIFICATION -->
    <div class="notif-wrapper">

      <button class="notif-btn" onclick="toggleNotif()">

        <i class="fa-solid fa-bell"></i>

        <span id="notifCount" class="notif-count">
          0
        </span>

      </button>

      <!-- DROPDOWN -->
      <div id="notifDropdown" class="notif-dropdown">

        <h3>Notifications</h3>

        <div id="notifList">
          No notifications
        </div>

      </div>

    </div>

    <!-- USER -->
    <div class="top-user" id="topUser">
      User
    </div>

    <!-- LOGOUT -->
    <button class="logout-btn" onclick="logout()">

      <i class="fa-solid fa-right-from-bracket"></i>

      Logout

    </button>

  </div>

  <!-- LEFT -->
  <div class="home-left">

    <div class="card hero-card">

      <h1 id="greet">Hey 👋</h1>

      <p>
        Focus on your learning today 🚀
      </p>

    </div>

  </div>

  <!-- CENTER -->
  <div class="home-center">

    <div class="flip-clock-card">

      <div id="clock" class="flip-clock">
        00:00:00
      </div>

      <div id="dateText" class="clock-date">
        Monday
      </div>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="home-right">

    <!-- QUICK NOTE -->
    <div class="card home-tile">

      <h3>📝 Quick Note</h3>

      <input
        id="noteTitle"
        placeholder="Title">

      <textarea
        id="noteContent"
        placeholder="Write something..."></textarea>

      <button class="nav-btn" onclick="saveNote()">
        Save
      </button>

      <p id="noteMsg"></p>

    </div>

    <!-- PROGRESS -->
    <div class="card home-tile">

      <h3>📈 Overall Progress</h3>

      <div class="dial-wrapper">

        <svg class="dial" viewBox="0 0 100 100">

          <circle
            class="bg"
            cx="50"
            cy="50"
            r="40"></circle>

          <circle
            class="progress"
            cx="50"
            cy="50"
            r="40"></circle>

        </svg>

        <div class="dial-text" id="dialPercent">
          0%
        </div>

      </div>

      <p>
        Auto calculated from completed topics
      </p>

    </div>

  </div>

</div>

<script>

/* =========================================
   NAVIGATION
========================================= */

function go(page){
  window.location.href = page
}

/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut()

  window.location.href = "login.html"
}

/* =========================================
   CLOCK
========================================= */

function updateClock(){

  const now = new Date()

  document.getElementById("clock").innerText =
    now.toLocaleTimeString()

  document.getElementById("dateText").innerText =
    now.toDateString()
}

setInterval(updateClock, 1000)

updateClock()

/* =========================================
   USER
========================================= */

async function setUser(){

  const { data } =
    await supabaseClient.auth.getUser()

  const user = data?.user

  if(!user){

    window.location.href = "login.html"

    return
  }

  const name =
    user.email.split("@")[0]

  document.getElementById("greet").innerText =
    `Hey ${name} 👋`

  document.getElementById("topUser").innerText =
    name
}

setUser()

/* =========================================
   SAVE NOTE
========================================= */

async function saveNote(){

  const { data: userData } =
    await supabaseClient.auth.getUser()

  const user = userData?.user

  const title =
    document.getElementById("noteTitle").value

  const content =
    document.getElementById("noteContent").value

  if(!title || !content){

    document.getElementById("noteMsg").innerText =
      "Fill all fields"

    return
  }

  /* SAVE NOTE */
  const { error } =
    await supabaseClient
      .from("notes")
      .insert([{
        user_id:user.id,
        title,
        content
      }])

  if(error){

    document.getElementById("noteMsg").innerText =
      error.message

    return
  }

  /* CREATE NOTIFICATION */
  await supabaseClient
    .from("notifications")
    .insert([{
      message:
        `${user.email.split("@")[0]} added "${title}"`
    }])

  document.getElementById("noteMsg").innerText =
    "Saved ✅"

  document.getElementById("noteTitle").value = ""

  document.getElementById("noteContent").value = ""
}

/* =========================================
   LOAD DIAL
========================================= */

async function loadDial(){

  const { data } =
    await supabaseClient.auth.getUser()

  const user = data?.user

  if(!user) return

  /* GET SUBJECTS */
  const { data: subjects } =
    await supabaseClient
      .from("subjects")
      .select("*")
      .eq("user_id", user.id)

  if(!subjects || subjects.length === 0){

    updateDial(0)

    return
  }

  let overall = 0

  for(const subject of subjects){

    /* GET TOPICS */
    const { data: topics } =
      await supabaseClient
        .from("topics")
        .select("*")
        .eq("subject_id", subject.id)

    const total =
      topics.length

    const completed =
      topics.filter(
        t => t.completed
      ).length

    const percent =
      total > 0
      ? (completed / total) * 100
      : 0

    overall += percent
  }

  const finalPercent =
    Math.round(
      overall / subjects.length
    )

  updateDial(finalPercent)
}

/* =========================================
   UPDATE DIAL
========================================= */

function updateDial(percent){

  document.getElementById("dialPercent").innerText =
    percent + "%"

  const circle =
    document.querySelector(".dial .progress")

  const radius = 40

  const circumference =
    2 * Math.PI * radius

  circle.style.strokeDasharray =
    circumference

  circle.style.strokeDashoffset =
    circumference -
    (percent / 100) * circumference
}

loadDial()

setInterval(loadDial, 3000)

/* =========================================
   NOTIFICATIONS
========================================= */

let notifCount = 0

function toggleNotif(){

  const dropdown =
    document.getElementById("notifDropdown")

  dropdown.classList.toggle("show-dropdown")
}

/* LOAD NOTIFICATIONS */
async function loadNotifications(){

  const { data } =
    await supabaseClient
      .from("notifications")
      .select("*")
      .order("created_at", {
        ascending:false
      })
      .limit(10)

  renderNotifications(data)
}

/* RENDER */
function renderNotifications(data){

  const list =
    document.getElementById("notifList")

  if(!data || data.length === 0){

    list.innerHTML =
      "No notifications"

    return
  }

  list.innerHTML =
    data.map(n => `

      <div class="notif-item">

        🔔 ${n.message}

      </div>

    `).join("")
}

/* REALTIME */
supabaseClient
  .channel("realtime-notifications")

  .on(
    "postgres_changes",

    {
      event:"INSERT",
      schema:"public",
      table:"notifications"
    },

    async () => {

      notifCount++

      document.getElementById("notifCount").innerText =
        notifCount

      loadNotifications()
    }
  )

  .subscribe()

loadNotifications()

</script>

</body>
</html>
