<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>Study Workspace</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

</head>

<body>

<!-- ======================================
     PAGE LOADER
====================================== -->

<div id="pageLoader">

  <div class="loader-spinner"></div>

  <p>
    Loading Workspace...
  </p>

</div>

<!-- SIDEBAR -->
<div class="sidebar">

  <button class="nav-btn active-nav" onclick="go('home.html')">
    <i class="fa-solid fa-house"></i>
    Home
  </button>

  <button class="nav-btn" onclick="go('index.html')">
    <i class="fa-solid fa-chart-line"></i>
    Dashboard
  </button>

  <button class="nav-btn" onclick="go('notes.html')">
    <i class="fa-solid fa-note-sticky"></i>
    Notes
  </button>

<button
  class="nav-btn"
  onclick="logout()">

  <i class="fa-solid fa-right-from-bracket"></i>

  Log Out

</button>


</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP -->

<div class="home-top">

  <div class="glass-card welcome-card">

    <h1 id="welcomeText">

      Hey 👋

      <span id="userName"></span>

    </h1>

    <p>
      Focus on your learning today 🚀
    </p>

  </div>

</div>


  <!-- GRID -->
  <div class="home-grid">

    <!-- CLOCK -->
    <div class="glass-card flip-clock-card">

      <div id="clock">

        00:00:00

      </div>

    </div>

    <!-- NOTES -->
<div class="glass-card note-card">

  <h2>
    📝 Quick Notes
  </h2>

  <textarea
    id="quickNotes"
    placeholder="Write something..."></textarea>

  <button
    class="save-note-btn"
    onclick="addQuickNote()">

    Add Note

  </button>

  <p id="saveStatus">
  </p>

</div>

    <!-- CONTINUE -->
    <div class="glass-card continue-card">

      <h2>
        📚 Continue Learning
      </h2>

      <p>
        Continue your DevOps roadmap journey.
      </p>

      <button
        class="open-dashboard-btn"
        onclick="go('index.html')">

        Open Dashboard

      </button>

    </div>

    <!-- SQUAD -->
    <div class="glass-card squad-card">

      <h2>
        👥 Squad Progress
      </h2>

      <div id="squadContainer">

        Loading...

      </div>

    </div>

  </div>

</div>

<script>

/* =========================================
   NAVIGATION
========================================= */

function go(page){

  window.location.href = page
}

/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut()

  window.location.href = "login.html"
}

/* =========================================
   CLOCK
========================================= */

function updateClock(){

  const now = new Date()

  const time =
    now.toLocaleTimeString()

  document.getElementById("clock")
    .innerText = time
}

setInterval(updateClock,1000)

updateClock()

/* =========================================
   LOAD USER
========================================= */

async function loadUser(){

  try {

    const { data } =
      await supabaseClient.auth.getUser()

    const user = data?.user

    if(!user) return

    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select("name")
        .eq("id", user.id)
        .single()

    if(profile){

      document.getElementById("welcomeText")
        .innerText =
        `Hey, ${profile.name} 👋`
    }

  } catch(err){

    console.error(err)
  }
}

/* =========================================
   LOAD SQUAD PROGRESS
========================================= */

async function loadSquadProgress(){

  const container =
    document.getElementById(
      "squadProgressContainer"
    )

  if(!container) return

  try {

    /* =====================================
       GET ALL USERS
    ===================================== */

    const {

      data:profiles,
      error:profileError

    } = await supabaseClient
      .from("profiles")
      .select("*")

    if(profileError){

      console.error(profileError)

      container.innerHTML =
        "Failed to load users"

      return
    }

    /* =====================================
       GET ALL TOPIC PROGRESS
    ===================================== */

    const {

      data:progressRows,
      error:progressError

    } = await supabaseClient
      .from("topic_progress")
      .select("*")

    if(progressError){

      console.error(progressError)

      container.innerHTML =
        "Failed to load progress"

      return
    }

    /* =====================================
       GET TOTAL TOPICS
    ===================================== */

    const {

      data:topics,
      error:topicError

    } = await supabaseClient
      .from("topics")
      .select("id")

    if(topicError){

      console.error(topicError)

      container.innerHTML =
        "Failed to load topics"

      return
    }

    const totalTopics =
      topics?.length || 1

    /* =====================================
       BUILD HTML
    ===================================== */

    let html = ""

    for(const profile of profiles){

      const userProgress =
        progressRows.filter(
          row => row.user_id === profile.id
        )

      const completedTopics =
        userProgress.filter(
          row => row.completed === true
        ).length

      const percentage =
        Math.round(
          (completedTopics / totalTopics)
          * 100
        )

      html += `

        <div class="squad-card">

          <div class="squad-top">

            <h3>

              👤 ${profile.name || "User"}

            </h3>

            <span>

              ${percentage}%

            </span>

          </div>

          <div class="progress-bar">

            <div
              class="progress-fill"
              style="width:${percentage}%">

            </div>

          </div>

        </div>

      `
    }

    container.innerHTML = html

  } catch(err){

    console.error(err)

    container.innerHTML =
      "Unexpected Error"
  }
}

/* =========================================
   LOAD SQUAD PROGRESS
========================================= */

async function loadSquadProgress(){

  console.log("Loading squad progress...")

  const container =
    document.getElementById(
      "squadProgressContainer"
    )

  if(!container){

    console.log("Container missing")
    return
  }

  try {

    /* GET USERS */

    const { data:profiles , error:profileError } =
      await supabaseClient
        .from("profiles")
        .select("*")

    console.log("Profiles:", profiles)

    if(profileError){

      console.error(profileError)

      container.innerHTML =
        "Failed loading users"

      return
    }

    /* GET TOPICS */

    const { data:topics , error:topicError } =
      await supabaseClient
        .from("topics")
        .select("id")

    console.log("Topics:", topics)

    if(topicError){

      console.error(topicError)

      container.innerHTML =
        "Failed loading topics"

      return
    }

    /* GET PROGRESS */

    const {

      data:progressRows,
      error:progressError

    } = await supabaseClient
      .from("topic_progress")
      .select("*")

    console.log("Progress:", progressRows)

    if(progressError){

      console.error(progressError)

      container.innerHTML =
        "Failed loading progress"

      return
    }

    const totalTopics =
      topics?.length || 1

    let html = ""

    for(const profile of profiles){

      const userProgress =
        progressRows.filter(
          row => row.user_id === profile.id
        )

      const completed =
        userProgress.filter(
          row => row.completed === true
        ).length

      const percentage =
        Math.round(
          (completed / totalTopics) * 100
        )

      html += `

        <div class="squad-card">

          <div class="squad-top">

            <h3>

              👤 ${profile.name || "User"}

            </h3>

            <span>

              ${percentage}%

            </span>

          </div>

          <div class="progress-bar">

            <div
              class="progress-fill"
              style="width:${percentage}%">

            </div>

          </div>

        </div>

      `
    }

    container.innerHTML = html

  } catch(err){

    console.error(err)

    container.innerHTML =
      "Unexpected error"
  }
}


/* =========================================
   INITIAL LOAD
========================================= */

loadUser()

loadSquadProgress()

/* =========================================
   ADD QUICK NOTE
========================================= */

async function addQuickNote(){

  const saveStatus =
    document.getElementById("saveStatus")

  try {

    const textarea =
      document.getElementById("quickNotes")

    const text =
      textarea.value.trim()

    if(!text){

      saveStatus.innerText =
        "Enter a note"

      return
    }

    /* GET USER */

    const { data:userData , error:userError } =
      await supabaseClient.auth.getUser()

    if(userError){

      console.error(userError)

      saveStatus.innerText =
        "User Error"

      return
    }

    const user =
      userData?.user

    if(!user){

      saveStatus.innerText =
        "Not logged in"

      return
    }

    /* GET PROFILE */

    let userName = "User"

    const { data:profile } =
      await supabaseClient
        .from("profiles")
        .select("name")
        .eq("id", user.id)
        .maybeSingle()

    if(profile?.name){

      userName = profile.name
    }

    /* INSERT NOTE */

    const { error } =
      await supabaseClient
        .from("notes")
        .insert([{

          user_id:user.id,

          user_name:userName,

          content:text

        }])

    if(error){

      console.error(error)

      saveStatus.innerText =
        "Save Failed"

      return
    }

    /* SUCCESS */

    textarea.value = ""

    saveStatus.innerText =
      "Note Added"

  } catch(err){

    console.error(err)

    saveStatus.innerText =
      "Unexpected Error"
  }
}

/* =========================================
   SAFE PAGE LOADER
========================================= */

window.onload = ()=>{

  const loader =
    document.getElementById("pageLoader")

  if(loader){

    loader.style.opacity = "0"

    setTimeout(()=>{

      loader.style.display = "none"

    },300)
  }
}

/* =========================================
   FALLBACK FORCE HIDE
========================================= */

setTimeout(()=>{

  const loader =
    document.getElementById("pageLoader")

  if(loader){

    loader.style.display = "none"
    loader.style.opacity = "0"
  }

},3000)

async function logout(){

  await supabaseClient.auth.signOut()

  window.location.replace(
    "login.html"
  )
}


/* =========================================
   TOGGLE TOPIC
========================================= */

async function toggleTopic(
  topicId,
  checked
){

  try {

    /* GET CURRENT USER */

    const {

      data:{ user }

    } = await supabaseClient.auth.getUser()

    if(!user){

      console.log("No user")

      return
    }

    /* CHECK EXISTING ENTRY */

    const {

      data:existing

    } = await supabaseClient
      .from("topic_progress")
      .select("*")
      .eq("user_id", user.id)
      .eq("topic_id", topicId)
      .maybeSingle()

    /* UPDATE EXISTING */

    if(existing){

      await supabaseClient
        .from("topic_progress")
        .update({

          completed: checked

        })
        .eq("id", existing.id)

    } else {

      /* CREATE NEW */

      await supabaseClient
        .from("topic_progress")
        .insert([{

          user_id: user.id,

          topic_id: topicId,

          completed: checked

        }])
    }

    console.log("Saved")

  } catch(err){

    console.error(err)
  }
}

/* =========================================
   GET USER NAME FROM AUTH
========================================= */

async function loadProfile(){

  const { data:{ user } } =
    await supabaseClient.auth.getUser()

  if(!user){
    window.location.replace("login.html")
    return
  }

  const name =
    user.user_metadata?.name || "User"

  document.getElementById("userName")
    .innerText = " " + name
}

loadProfile()

</script>



</body>
</html>
