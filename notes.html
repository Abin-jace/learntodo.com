<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
  <title>Notes</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<div class="sidebar">

  <button class="nav-btn" onclick="go('home.html')">
    <i class="fa-solid fa-house"></i> Home
  </button>

  <button class="nav-btn" onclick="go('index.html')">
    <i class="fa-solid fa-chart-line"></i> Dashboard
  </button>

  <button class="nav-btn" onclick="go('notes.html')">
    <i class="fa-solid fa-note-sticky"></i> Notes
  </button>

</div>

<div class="main">

  <h2>Shared Notes</h2>

  <input id="title" placeholder="Title">
  <input id="content" placeholder="Content">

  <button onclick="save()">Save</button>

  <div id="notes"></div>

</div>

<script>

function go(p){ window.location.href = p }

async function save(){

  await supabaseClient.from("notes").insert([{
    title: document.getElementById("title").value,
    content: document.getElementById("content").value
  }])

  load()
}

async function load(){

  const { data } = await supabaseClient.from("notes").select("*")

  let html = ""

  data?.forEach(n => {
    html += `
      <div class="card">
        <h3>${n.title}</h3>
        <p>${n.content}</p>
      </div>
    `
  })

  document.getElementById("notes").innerHTML = html
}

load()

</script>

</body>
</html>
