<!DOCTYPE html>
<html>

<head>

  <title>Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      padding:30px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:15px;
      margin-bottom:15px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      background:#38bdf8;
      font-weight:bold;
    }
  </style>

</head>

<body>

<h1>Dashboard</h1>

<button onclick="logout()">Logout</button>

<div id="users">Loading...</div>

<script>

let sessionChecked = false

// ============================
// 1. PROTECT PAGE FIRST
// ============================

async function protectPage(){

  const { data } =
    await supabaseClient.auth.getSession()

  if(!data.session){
    window.location.href = "login.html"
    return
  }

  sessionChecked = true
  load()
}

protectPage()

// ============================
// 2. LOAD DASHBOARD DATA
// ============================

async function load(){

  if(!sessionChecked) return

  const { data: profiles } =
    await supabaseClient.from("profiles").select("*")

  const { data: progress } =
    await supabaseClient.from("progress").select("*")

  let html = ""

  profiles.forEach(p => {

    const prog =
      progress.find(x => x.user_id === p.id)

    html += `
      <div class="card">
        <h3>${p.name}</h3>
        <p>Linux: ${prog?.linux || 0}%</p>
        <p>Docker: ${prog?.docker || 0}%</p>
        <p>Kubernetes: ${prog?.kubernetes || 0}%</p>
      </div>
    `
  })

  document.getElementById("users").innerHTML = html
}

// ============================
// 3. LOGOUT
// ============================

async function logout(){

  await supabaseClient.auth.signOut()
  window.location.href = "login.html"

}

</script>

</body>
</html>
